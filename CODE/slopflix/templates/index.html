<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Slopflix</title>
  <script src="https://unpkg.com/htmx.org@1.9.10"></script>
  <style>
    :root {
      --maroon: #8C1D40;
      --gold:   #FFC627;
      --bg:     #141414;
      --card:   #1e1e1e;
      --muted:  #888;
      --text:   #e5e5e5;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Helvetica Neue', Arial, sans-serif;
      min-height: 100vh;
    }

    /* ── Header ─────────────────────────────────────── */
    header {
      background: var(--maroon);
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      gap: 1.25rem;
      box-shadow: 0 2px 12px rgba(0,0,0,0.5);
    }

    .logo {
      color: var(--gold);
      font-size: 2.4rem;
      font-weight: 900;
      letter-spacing: -1px;
      line-height: 1;
    }

    .logo-divider {
      width: 2px;
      height: 2.4rem;
      background: rgba(255,198,39,0.3);
    }

    .tagline {
      color: rgba(255,255,255,0.65);
      font-size: 0.82rem;
      line-height: 1.4;
    }

    /* ── Controls bar ────────────────────────────────── */
    .controls {
      background: #1a1a1a;
      border-bottom: 2px solid var(--maroon);
      padding: 1.25rem 2rem;
      display: flex;
      gap: 1.5rem;
      align-items: flex-end;
      flex-wrap: wrap;
    }

    .ctrl-group {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    label {
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--gold);
      text-transform: uppercase;
      letter-spacing: 0.07em;
    }

    input[type="number"],
    select {
      background: #2a2a2a;
      border: 1px solid #444;
      border-radius: 4px;
      color: var(--text);
      padding: 0.5rem 0.7rem;
      font-size: 0.9rem;
    }

    input[type="number"] { width: 110px; }
    select               { width: 150px; }

    input[type="number"]:focus,
    select:focus {
      outline: none;
      border-color: var(--gold);
    }

    .quick-users {
      display: flex;
      gap: 0.35rem;
      margin-top: 0.25rem;
    }

    .quick-btn {
      background: #2a2a2a;
      border: 1px solid #444;
      color: var(--muted);
      padding: 0.2rem 0.55rem;
      border-radius: 3px;
      font-size: 0.78rem;
      cursor: pointer;
    }

    .quick-btn:hover { border-color: var(--gold); color: var(--gold); }

    .btn-go {
      background: var(--maroon);
      color: var(--gold);
      border: 2px solid var(--gold);
      padding: 0.55rem 1.4rem;
      border-radius: 4px;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      cursor: pointer;
      transition: background 0.15s;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .btn-go:hover { background: #a52050; }

    .spinner {
      display: none;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255,198,39,0.3);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .htmx-request .spinner  { display: inline-block; }
    .htmx-request .btn-text { display: none; }

    /* ── Main content ─────────────────────────────────── */
    main { padding: 2rem; }

    #results-area { min-height: 80px; }

    .placeholder {
      color: var(--muted);
      font-size: 0.9rem;
      padding: 1rem 0;
    }

    /* ── Error ────────────────────────────────────────── */
    .error-msg {
      color: #ff6b6b;
      background: #2a1a1a;
      border-left: 4px solid #ff6b6b;
      padding: 0.75rem 1rem;
      border-radius: 4px;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

<header>
  <div class="logo">SLOPFLIX</div>
  <div class="logo-divider"></div>
  <div class="tagline">
    ASU Movie Recommendation System<br>
    <span style="font-size:0.75rem; opacity:0.6;">CSE 573 — Group 20</span>
  </div>
</header>

<form class="controls"
      hx-post="/recommend"
      hx-target="#results-area"
      hx-swap="innerHTML"
      hx-indicator=".btn-go">

  <div class="ctrl-group">
    <label>User ID</label>
    <input type="number" name="user_id" id="user-input" value="42" min="1" max="71567" required />
    <div class="quick-users">
      <button type="button" class="quick-btn" onclick="document.getElementById('user-input').value=42">42</button>
      <button type="button" class="quick-btn" onclick="document.getElementById('user-input').value=150">150</button>
      <button type="button" class="quick-btn" onclick="document.getElementById('user-input').value=1054">1054</button>
    </div>
  </div>

  <div class="ctrl-group">
    <label>Model</label>
    <select name="model">
      <option value="neumf">NeuMF</option>
      <option value="als">ALS</option>
      <option value="knn">ItemKNN</option>
    </select>
  </div>

  <div class="ctrl-group">
    <label>Dataset</label>
    <select name="dataset">
      <option value="1m">MovieLens 1M</option>
      <option value="10m">MovieLens 10M</option>
    </select>
  </div>

  <div class="ctrl-group">
    <label>Top N</label>
    <input type="number" name="topn" value="10" min="1" max="20" />
  </div>

  <button type="submit" class="btn-go">
    <span class="btn-text">&#9654; Get Recommendations</span>
    <span class="spinner"></span>
    <span class="htmx-request" style="display:none; color:var(--gold); font-size:0.85rem;">Loading…</span>
  </button>

</form>

<main>
  <div id="results-area">
    <p class="placeholder">Select a user and model above, then click Get Recommendations.</p>
  </div>
</main>

</body>
</html>
